[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurofade"
version = "0.1.0"
description = "Live forgetting visualizer for continual learning — watch your neural network forget in real time"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["deep-learning", "continual-learning", "catastrophic-forgetting", "visualization", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "Pillow>=9.0",
]

[project.optional-dependencies]
chain = [
    "web3>=6.0",
    "eth-account>=0.10",
]

[project.urls]
Homepage = "https://github.com/neurofade/neurofade"
Issues = "https://github.com/neurofade/neurofade/issues"

[project.scripts]
neurofade = "neurofade.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["neurofade*"]
